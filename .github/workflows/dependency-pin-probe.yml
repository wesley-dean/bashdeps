---
# Temporary workflow used to resolve exact current release pins for this branch.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - agent/self-host-reference-integration
  pull_request:
  workflow_dispatch:

name: Dependency pin probe
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve latest release pins
        shell: bash
        run: |
          set -euo pipefail

          resolve_asset() {
            local repo=$1
            local asset=$2
            local release_file
            local tag
            local url
            local output

            release_file="$(mktemp)"
            output="$(mktemp)"
            curl -fsSL "https://api.github.com/repos/wesley-dean/${repo}/releases/latest" -o "${release_file}"
            tag="$(jq -r '.tag_name' "${release_file}")"
            url="$(jq -r --arg asset "${asset}" '.assets[] | select(.name == $asset) | .browser_download_url' "${release_file}")"
            test -n "${tag}"
            test -n "${url}"
            curl -fsSL "${url}" -o "${output}"
            printf '%s tag=%s asset=%s sha256=%s\n' \
              "${repo}" "${tag}" "${asset}" "$(sha256sum "${output}" | awk '{print $1}')"
            rm -f "${release_file}" "${output}"
          }

          resolve_tagged_file() {
            local repo=$1
            local path=$2
            local release_file
            local tag
            local url
            local output

            release_file="$(mktemp)"
            output="$(mktemp)"
            curl -fsSL "https://api.github.com/repos/wesley-dean/${repo}/releases/latest" -o "${release_file}"
            tag="$(jq -r '.tag_name' "${release_file}")"
            test -n "${tag}"
            url="https://raw.githubusercontent.com/wesley-dean/${repo}/${tag}/${path}"
            curl -fsSL "${url}" -o "${output}"
            printf '%s tag=%s path=%s sha256=%s\n' \
              "${repo}" "${tag}" "${path}" "$(sha256sum "${output}" | awk '{print $1}')"
            rm -f "${release_file}" "${output}"
          }

          resolve_asset bashdeps bashdeps.bash
          resolve_asset mktext mktext.bash
          resolve_tagged_file bash-doxygen doxygen-bash.awk
